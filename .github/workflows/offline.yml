name: offline-evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.lock.txt
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/verify_portable.py
      - run: PYTHONPATH=. python scripts/reproduce_portable.py --output work/ci-reproduce
